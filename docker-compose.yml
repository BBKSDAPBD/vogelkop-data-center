version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vogelkop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vogelkop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vogelkop_secret}
      POSTGRES_DB: ${DB_NAME:-vogelkop_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vogelkop} -d ${DB_NAME:-vogelkop_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vogelkop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
